name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Check axioms of the main theorems
        run: |
          lake build SteinTomasCircle.Axioms 2>&1 | tee axioms.log
          if grep -q sorryAx axioms.log; then echo "sorry found"; exit 1; fi
