name = "SteinTomasCircle"
version = "1.0.0"
keywords = ["math", "harmonic analysis", "Fourier restriction"]
defaultTargets = ["SteinTomasCircle"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "SteinTomasCircle"

# Statements with `sorry`, used only by `lake check` / comparator (see README).
[[lean_lib]]
name = "Challenge"
